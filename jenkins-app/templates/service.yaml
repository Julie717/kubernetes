apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  ports:
    - name: master
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}
    - name: slave
      port: {{ .Values.slave.port }}
      targetPort: {{ .Values.slave.port }}
  selector:
    app: {{ .Values.appName }}
